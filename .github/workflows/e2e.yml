name: End-to-End

# Not on every pull request. The suite builds the extension and drives a real browser, so it costs
# minutes rather than seconds, and it exercises packaging rather than the code a typical change
# touches. Nightly plus on demand keeps the signal without taxing every push (#141).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege: the token can read the repository and nothing more (#143).
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Local Nostr relays for the messaging tests (tests/e2e/fixtures/relays.ts). Pinned by version
      # and by hash: the release publishes no checksum, so the hash was taken from the v0.21.0
      # release asset when it was pinned. Bump both together.
      - name: Install nak
        env:
          NAK_VERSION: v0.21.0
          NAK_SHA256: 7bf6d8d82a9e9cf9aca74a04449fb2235bc49624a73b3539cf7d6f95304837a1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nak" \
            "https://github.com/fiatjaf/nak/releases/download/${NAK_VERSION}/nak-${NAK_VERSION}-linux-amd64"
          echo "${NAK_SHA256}  $HOME/.local/bin/nak" | sha256sum --check
          chmod +x "$HOME/.local/bin/nak"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nak" --version

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e

      # Firefox is driven through WebDriver, not Playwright, so it needs a real Firefox on the
      # runner rather than a Playwright download. ubuntu-latest ships one.
      - name: Run Firefox end-to-end tests
        run: npm run test:e2e:firefox

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
