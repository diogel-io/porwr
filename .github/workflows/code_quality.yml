name: Qodana

# Static analysis with Qodana for JS. On a pull request it checks the changed files and annotates
# the diff; on master it records the baseline in Qodana Cloud.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# Least privilege: the token can read the repository and nothing more (#143).
permissions:
  contents: read

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    # A fork's pull request gets no QODANA_TOKEN, so the scan could only fail there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Annotations need checks, the summary comment needs pull requests. No contents: write, so
    # Qodana can never push fixes.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's own commit, not the merge commit, with the history Qodana compares.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          push-fixes: none
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
