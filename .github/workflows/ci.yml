name: Build and Test
# master has no push trigger: branch protection already requires this workflow's `build`
# job to pass as a pull_request check before any commit reaches master, and release.yml's
# own build job re-verifies + packages the exact release commit — a push-triggered rerun
# here would just duplicate that work.
on:
  push:
    branches:
      - develop
  # No branch filter: a pull request stacked on another feature branch is still code heading
  # for master, and filtering by base left those PRs with no checks at all until they were
  # retargeted. Running on every pull request costs one job and closes that gap.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Against a stand-in for curl: nothing reaches the Chrome Web Store.
      - name: Test the Chrome Web Store publish script
        run: bash .github/scripts/test-publish-chrome.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      # Runs the same tests again with coverage instrumentation, and fails if any threshold in
      # vitest.config.ts is breached. Without this step the thresholds are configuration nobody
      # enforces, which is the state #143 existed to end.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build default app
        run: npm run build

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox
